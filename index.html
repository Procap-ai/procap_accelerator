<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procap Accelerator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.25rem;
    }

    p.tagline {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: #888;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 0.45rem 1.1rem;
      font-size: 0.85rem;
      color: #aaa;
      letter-spacing: 0.05em;
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.78rem;
      color: #444;
    }

    footer a {
      color: #666;
      text-decoration: none;
    }

    footer a:hover { color: #aaa; }
  </style>
</head>
<body>

  <div class="logo">procap.ai</div>

  <h1>Welcome to<br>Procap Accelerator</h1>

  <p class="tagline">
    Empowering growth through intelligent tools and smart capital.
  </p>

  <span class="badge">Coming Soon</span>

  <footer>
    &copy; <script>document.write(new Date().getFullYear())</script> <a href="https://procap.ai">procap.ai</a>
  </footer>

</body>
</html>
