<div class="home">
  <header class="header">
    <img src="https://framerusercontent.com/images/O6vOCZlrgab4i9yukLuUTBWzZ3w.png" alt="Procap" class="logo" />
  </header>

  <main class="main">
    <div class="hero">
      <h1 class="hero-title">AI-Powered QA Testing</h1>
      <p class="hero-sub">Let our AI agent browse and test your website, then surface real issues — in minutes.</p>
    </div>

    <div class="card">
      <form (ngSubmit)="submit()" #form="ngForm" novalidate>
        <div class="field">
          <label class="label" for="url">Website URL</label>
          <input
            id="url"
            class="input"
            type="url"
            [(ngModel)]="url"
            name="url"
            placeholder="https://your-site.com"
            autocomplete="off"
            spellcheck="false"
            [disabled]="isSubmitting"
          />
        </div>

        <div class="field">
          <button
            type="button"
            class="toggle-instructions"
            (click)="showInstructions = !showInstructions"
          >
            <span class="toggle-icon">{{ showInstructions ? '▾' : '▸' }}</span>
            {{ showInstructions ? 'Hide' : 'Add' }} testing instructions
            <span class="toggle-hint">(optional)</span>
          </button>

          @if (showInstructions) {
            <textarea
              class="textarea"
              [(ngModel)]="instructions"
              name="instructions"
              rows="3"
              placeholder="e.g. Check factual issues on this page, test the login flow, look for broken links..."
              [disabled]="isSubmitting"
            ></textarea>
          }
        </div>

        @if (errorMessage) {
          <p class="error">{{ errorMessage }}</p>
        }

        <button
          type="submit"
          class="btn-primary"
          [disabled]="isSubmitting || remaining === 0"
        >
          @if (isSubmitting) {
            <span class="spinner"></span> Starting analysis...
          } @else if (remaining === 0) {
            Daily limit reached
          } @else {
            Start AI Test &rarr;
          }
        </button>

        @if (limits) {
          <p class="usage">{{ usageText }}</p>
        }
      </form>
    </div>

    <div class="features">
      <div class="feature">
        <span class="feature-icon">🔍</span>
        <span>Real browser testing</span>
      </div>
      <div class="feature">
        <span class="feature-icon">📸</span>
        <span>Live screenshots</span>
      </div>
      <div class="feature">
        <span class="feature-icon">📊</span>
        <span>Structured findings</span>
      </div>
    </div>
  </main>
</div>
